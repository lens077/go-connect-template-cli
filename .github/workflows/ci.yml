name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, vet, and generate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out CLI
        uses: actions/checkout@v7

      - name: Check out template
        uses: actions/checkout@v7
        with:
          repository: lens077/go-connect-template
          path: go-connect-template

      # 生成物继承模板的 go directive，比 CLI 自身的高；工具链按模板装，
      # 否则生成物 go mod tidy 会因 GOTOOLCHAIN=local 拒绝。
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-connect-template/go.mod
          cache: true

      # protoc 插件版本跟模板 go.mod 走，避免与生成物依赖漂移。
      - name: Install generation tools
        working-directory: go-connect-template
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install google.golang.org/protobuf/cmd/protoc-gen-go
          # 模板 v0.3.0 起生成物基于 connect-go v2,CI 的插件必须同代,
          # 否则 monorepo 测试的 buf 钩子会产出 v1 形状、与模板编译冲突。
          go install connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.2

      - name: Download dependencies
        run: go mod download

      - name: Run tests and generation matrix
        env:
          CO_TEMPLATE_DIR: ${{ github.workspace }}/go-connect-template
        run: go test ./...

      - name: Run vet
        run: go vet ./...
